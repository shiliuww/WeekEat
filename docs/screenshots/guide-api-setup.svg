  <rect x="112" y="474" width="406" height="78" rx="18" fill="#FFFDF8" stroke="#3D2B1F" stroke-width="2"/>
  <text x="132" y="505" fill="#6A5444" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">API 地址</text>
  <text x="132" y="533" fill="#A98C79" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">https://api.deepseek.com/v1</text>

  <rect x="112" y="572" width="406" height="78" rx="18" fill="#FFFDF8" stroke="#3D2B1F" stroke-width="2"/>
