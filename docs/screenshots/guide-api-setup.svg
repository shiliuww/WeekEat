<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" rx="32" fill="#FFF7EB"/>
  <rect x="40" y="40" width="1200" height="680" rx="30" fill="#FFFDF8" stroke="#3D2B1F" stroke-width="4"/>
  <text x="80" y="112" fill="#3D2B1F" font-size="38" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">首次使用：先配置 API</text>
  <text x="80" y="150" fill="#8C6B54" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">在首页右上角点“设置”，选择厂商并填写 API Key、地址和模型。</text>

  <rect x="80" y="188" width="470" height="472" rx="24" fill="#FFF8EF" stroke="#3D2B1F" stroke-width="3"/>
  <text x="112" y="238" fill="#3D2B1F" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">API 设置</text>

  <rect x="112" y="274" width="406" height="82" rx="20" fill="#FFE1D2" stroke="#D46A4C" stroke-width="3"/>
  <text x="138" y="322" fill="#B85C3D" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">DeepSeek</text>
  <text x="138" y="346" fill="#8C6B54" font-size="17" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">性价比高，文本能力稳定</text>

  <rect x="112" y="376" width="406" height="78" rx="18" fill="#FFFDF8" stroke="#3D2B1F" stroke-width="2"/>
