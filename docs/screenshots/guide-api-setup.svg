  <text x="694" y="562" fill="#3D2B1F" font-size="26" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">确认地址和模型</text>
  <text x="694" y="596" fill="#8C6B54" font-size="19" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">填写完成后返回首页即可，配置会保存在当前设备本地。</text>
