  <text x="132" y="631" fill="#A98C79" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">deepseek-chat / gpt-4o / glm-4.5v ...</text>

  <circle cx="642" cy="268" r="28" fill="#EF6C43"/>
  <text x="632" y="278" fill="white" font-size="24" font-family="Arial, sans-serif" font-weight="700">1</text>
  <path d="M614 268H554" stroke="#EF6C43" stroke-width="5" stroke-linecap="round"/>
  <text x="694" y="258" fill="#3D2B1F" font-size="26" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">选择 AI 厂商</text>
  <text x="694" y="292" fill="#8C6B54" font-size="19" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">可选 OpenAI、DeepSeek、智谱、Kimi、Qwen。</text>

  <circle cx="642" cy="420" r="28" fill="#EF6C43"/>
  <text x="632" y="430" fill="white" font-size="24" font-family="Arial, sans-serif" font-weight="700">2</text>
  <path d="M614 420H554" stroke="#EF6C43" stroke-width="5" stroke-linecap="round"/>
  <text x="694" y="410" fill="#3D2B1F" font-size="26" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">填写 API Key</text>
  <text x="694" y="444" fill="#8C6B54" font-size="19" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">没有 API Key 时，图片识别和 AI 生成无法启用。</text>

  <circle cx="642" cy="572" r="28" fill="#EF6C43"/>
  <text x="632" y="582" fill="white" font-size="24" font-family="Arial, sans-serif" font-weight="700">3</text>
